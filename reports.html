<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FoodyFix — Smart Reports</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
  :root{--emerald:#10b981;--emerald-dark:#059669;--amber:#f59e0b;--coral:#f43f5e;--slate:#0f172a;--slate-mid:#1e293b;--muted:#64748b;--border:rgba(16,185,129,0.15);--glass:rgba(255,255,255,0.03);--text:#f8fafc;--sidebar-w:260px;}
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'DM Sans',sans-serif;background:var(--slate);color:var(--text);display:flex;min-height:100vh;}
  .sidebar{width:var(--sidebar-w);min-height:100vh;background:var(--slate-mid);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:1.5rem 1rem;position:fixed;top:0;left:0;bottom:0;}
  .sidebar-logo{font-family:'Syne',sans-serif;font-weight:800;font-size:1.35rem;background:linear-gradient(135deg,var(--emerald),#34d399);-webkit-background-clip:text;-webkit-text-fill-color:transparent;padding:0.5rem 0.75rem;margin-bottom:2rem;}
  .sidebar-logo span{-webkit-text-fill-color:var(--amber);}
  .nav-item{display:flex;align-items:center;gap:0.75rem;padding:0.7rem 0.75rem;border-radius:10px;color:#94a3b8;text-decoration:none;font-size:0.9rem;font-weight:500;transition:all 0.15s;margin-bottom:0.2rem;}
  .nav-item:hover,.nav-item.active{background:rgba(16,185,129,0.1);color:var(--emerald);}
  .main{margin-left:var(--sidebar-w);flex:1;padding:2rem;}
  .page-title{font-family:'Syne',sans-serif;font-size:1.6rem;font-weight:800;letter-spacing:-0.5px;margin-bottom:0.3rem;}
  .page-sub{font-size:0.85rem;color:var(--muted);margin-bottom:2rem;}

  .month-selector{display:flex;align-items:center;gap:1rem;margin-bottom:2rem;padding:1rem 1.25rem;border-radius:14px;background:var(--glass);border:1px solid var(--border);}
  .month-input{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);border-radius:8px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:0.9rem;padding:0.5rem 0.75rem;outline:none;}
  .month-input:focus{border-color:var(--emerald);}
  .btn{padding:0.65rem 1.3rem;border-radius:9px;border:none;cursor:pointer;font-family:'DM Sans',sans-serif;font-weight:600;font-size:0.85rem;transition:all 0.2s;}
  .btn-primary{background:linear-gradient(135deg,var(--emerald),#34d399);color:#fff;}

  .stats-row{display:grid;grid-template-columns:repeat(5,1fr);gap:1rem;margin-bottom:1.5rem;}
  .stat-card{padding:1.2rem 1.4rem;border-radius:16px;background:var(--glass);border:1px solid var(--border);}
  .stat-label{font-size:0.68rem;font-weight:700;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-bottom:0.5rem;}
  .stat-val{font-family:'Syne',sans-serif;font-size:1.6rem;font-weight:800;}
  .stat-val.green{color:var(--emerald);}
  .stat-val.amber{color:var(--amber);}
  .stat-val.coral{color:var(--coral);}
  .stat-change{font-size:0.72rem;color:var(--muted);margin-top:0.2rem;}

  .card{padding:1.5rem;border-radius:16px;background:var(--glass);border:1px solid var(--border);}
  .card-title{font-family:'Syne',sans-serif;font-size:1rem;font-weight:700;margin-bottom:1.2rem;}
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1rem;}
  .chart-container{position:relative;height:240px;}

  /* AI insights card */
  .insight-card{padding:1.5rem;border-radius:16px;background:linear-gradient(135deg,rgba(99,102,241,0.08),rgba(139,92,246,0.05));border:1px solid rgba(99,102,241,0.2);margin-bottom:1rem;}
  .insight-badge{display:inline-flex;align-items:center;gap:0.4rem;padding:0.3rem 0.8rem;border-radius:100px;background:rgba(99,102,241,0.15);border:1px solid rgba(99,102,241,0.3);font-size:0.72rem;font-weight:700;color:#818cf8;letter-spacing:0.5px;text-transform:uppercase;margin-bottom:1rem;}
  .insight-headline{font-family:'Syne',sans-serif;font-size:1.3rem;font-weight:800;margin-bottom:0.5rem;}
  .insight-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin-top:1.25rem;}
  .insight-item{padding:1rem;border-radius:12px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);}
  .insight-item-label{font-size:0.68rem;font-weight:700;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-bottom:0.4rem;}
  .insight-item-val{font-size:0.9rem;line-height:1.5;}

  /* Grade dist */
  .grade-dist{display:flex;gap:0.5rem;flex-wrap:wrap;margin-top:1rem;}
  .grade-pill{display:flex;align-items:center;gap:0.5rem;padding:0.5rem 1rem;border-radius:100px;font-size:0.82rem;font-weight:600;}
  .gp-A{background:rgba(16,185,129,0.15);color:#10b981;}
  .gp-B{background:rgba(99,102,241,0.15);color:#818cf8;}
  .gp-C{background:rgba(245,158,11,0.15);color:#f59e0b;}
  .gp-D{background:rgba(249,115,22,0.15);color:#f97316;}
  .gp-F{background:rgba(244,63,94,0.15);color:#f43f5e;}

  .daily-table{width:100%;border-collapse:collapse;font-size:0.82rem;}
  .daily-table th{text-align:left;padding:0.5rem 0.75rem;color:var(--muted);font-size:0.68rem;font-weight:700;letter-spacing:1px;text-transform:uppercase;border-bottom:1px solid rgba(255,255,255,0.05);}
  .daily-table td{padding:0.6rem 0.75rem;border-bottom:1px solid rgba(255,255,255,0.03);}
  .daily-table tr:last-child td{border-bottom:none;}
  .daily-table tr:hover td{background:rgba(255,255,255,0.02);}

  .rec-item{display:flex;align-items:flex-start;gap:0.75rem;padding:0.85rem;border-radius:10px;background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.04);margin-bottom:0.5rem;}
  .rec-icon{font-size:1.1rem;flex-shrink:0;}
  .rec-text{font-size:0.85rem;line-height:1.5;}

  .loader-container{text-align:center;padding:3rem;color:var(--muted);}
  .loader{display:inline-block;width:20px;height:20px;border:2px solid rgba(255,255,255,0.2);border-top-color:var(--emerald);border-radius:50%;animation:spin 0.7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .fat-indicator{display:flex;align-items:center;gap:0.5rem;padding:0.75rem 1rem;border-radius:10px;margin-top:0.75rem;}
  .fat-gain{background:rgba(244,63,94,0.1);border:1px solid rgba(244,63,94,0.2);color:var(--coral);}
  .fat-loss{background:rgba(16,185,129,0.1);border:1px solid rgba(16,185,129,0.2);color:var(--emerald);}
  .fat-neutral{background:rgba(245,158,11,0.1);border:1px solid rgba(245,158,11,0.2);color:var(--amber);}
</style>
</head>
<body>
<aside class="sidebar">
  <div class="sidebar-logo">Foody<span>Fix</span></div>
  <a class="nav-item" href="/dashboard"><span>📊</span> Overview</a>
  <a class="nav-item" href="/orders"><span>📦</span> Order Manager</a>
  <a class="nav-item active" href="/reports"><span>📋</span> Reports</a>
  <a class="nav-item" href="/"><span>🏠</span> Home</a>
</aside>

<main class="main">
  <div class="page-title">📋 Smart Health Reports</div>
  <div class="page-sub">AI-generated monthly summaries with predictions and personalized insights</div>

  <div class="month-selector">
    <span style="font-size:0.85rem;font-weight:600;color:var(--muted);">Report for:</span>
    <input type="month" class="month-input" id="month-picker">
    <button class="btn btn-primary" onclick="loadReport()">Generate Report →</button>
    <span style="font-size:0.78rem;color:var(--muted);margin-left:auto;">🤖 AI insights powered by Precision AI</span>
  </div>

  <div id="report-container">
    <div class="loader-container"><div class="loader"></div><div style="margin-top:1rem;">Loading your health data…</div></div>
  </div>
</main>

<script>
let calChart, gradeChart;
const nowMonth = new Date().toISOString().slice(0,7);
document.getElementById('month-picker').value = nowMonth;

async function loadReport() {
  const month = document.getElementById('month-picker').value;
  document.getElementById('report-container').innerHTML = '<div class="loader-container"><div class="loader"></div><div style="margin-top:1rem;">Generating AI insights for '+month+'…</div></div>';

  try {
    const [reportData, predData] = await Promise.all([
      fetch(`/api/report?month=${month}`).then(r=>r.json()),
      fetch('/api/predict').then(r=>r.json())
    ]);

    renderReport(reportData, predData);
  } catch(e) {
    document.getElementById('report-container').innerHTML = '<div class="loader-container" style="color:var(--coral);">Error loading report. Make sure the server is running.</div>';
  }
}

function renderReport(report, pred) {
  const net = report.total_calories_consumed - report.total_calories_burned;
  const fatChange = report.fat_change_kg;
  const monthLabel = new Date(report.month+'-01').toLocaleDateString('en-IN',{month:'long',year:'numeric'});
  const gradeColors = {A:'#10b981',B:'#818cf8',C:'#f59e0b',D:'#f97316',F:'#f43f5e'};

  // Fat indicator
  let fatClass = 'fat-neutral', fatIcon = '⚖️', fatText = 'Weight maintained';
  if(fatChange > 0.1){ fatClass='fat-gain'; fatIcon='⚠️'; fatText=`+${fatChange.toFixed(2)} kg projected gain`; }
  else if(fatChange < -0.1){ fatClass='fat-loss'; fatIcon='✅'; fatText=`${fatChange.toFixed(2)} kg projected loss`; }

  document.getElementById('report-container').innerHTML = `
    <!-- AI Insight Card -->
    <div class="insight-card" style="margin-bottom:1.5rem;">
      <div class="insight-badge">🤖 AI Report · ${monthLabel}</div>
      <div class="insight-headline">Your ${monthLabel} Health Summary</div>
      <p style="font-size:0.85rem;color:#94a3b8;line-height:1.7;">
        ${report.total_meals_logged > 0
          ? `You logged <strong style="color:var(--text);">${report.total_meals_logged} meals</strong> consuming <strong style="color:var(--emerald);">${Math.round(report.total_calories_consumed).toLocaleString()} calories</strong> and burning <strong style="color:var(--amber);">${Math.round(report.total_calories_burned).toLocaleString()} calories</strong>.`
          : 'No meals logged this month yet. Start tracking to see your report!'
        }
      </p>
      <div class="insight-grid">
        <div class="insight-item">
          <div class="insight-item-label">Pattern</div>
          <div class="insight-item-val" style="color:${net>200?'var(--coral)':net<-200?'var(--amber)':'var(--emerald)'};">${net>200?'Calorie Surplus 📈':net<-200?'Calorie Deficit 📉':'Balanced ⚖️'}</div>
        </div>
        <div class="insight-item">
          <div class="insight-item-label">Fat Change</div>
          <div class="insight-item-val" style="color:${fatChange>0?'var(--coral)':'var(--emerald)'};">${fatChange>0?'+':''}${fatChange.toFixed(2)} kg projected</div>
        </div>
        <div class="insight-item">
          <div class="insight-item-label">Credits Earned</div>
          <div class="insight-item-val" style="color:var(--emerald);">${report.total_credits_earned} 🪙</div>
        </div>
      </div>
    </div>

    <!-- Stats Row -->
    <div class="stats-row" style="margin-bottom:1.5rem;">
      <div class="stat-card">
        <div class="stat-label">Calories Consumed</div>
        <div class="stat-val green">${Math.round(report.total_calories_consumed/1000).toFixed(1)}k</div>
        <div class="stat-change">${report.total_meals_logged} meals logged</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Calories Burned</div>
        <div class="stat-val amber">${Math.round(report.total_calories_burned/1000).toFixed(1)}k</div>
        <div class="stat-change">Total activity</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Net Calories</div>
        <div class="stat-val ${net>0?'coral':'green'}">${net>0?'+':''}${Math.round(net)}</div>
        <div class="stat-change">${net>0?'Surplus':'Deficit'}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Fatigue Risk</div>
        <div class="stat-val ${pred.fatigue_risk_pct>60?'coral':'amber'}">${pred.fatigue_risk_pct}%</div>
        <div class="stat-change">7-day average</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Health Score</div>
        <div class="stat-val green">${computeHealthScore(report, pred)}/100</div>
        <div class="stat-change">Overall grade</div>
      </div>
    </div>

    <!-- Fat Gain/Loss Banner -->
    <div class="fat-indicator ${fatClass}" style="margin-bottom:1rem;">
      <span style="font-size:1.2rem;">${fatIcon}</span>
      <div>
        <strong>${fatText}</strong><br>
        <span style="font-size:0.78rem;opacity:0.8;">Formula: ((Cal In - Cal Out) × 30) / 7700 = ${fatChange.toFixed(2)} kg over 30 days</span>
      </div>
    </div>

    <!-- Charts -->
    <div class="grid-2">
      <div class="card">
        <div class="card-title">Calories In vs Out (Daily)</div>
        <div class="chart-container"><canvas id="calChart"></canvas></div>
      </div>
      <div class="card">
        <div class="card-title">Health Grade Distribution</div>
        <div class="chart-container" style="height:180px;"><canvas id="gradeChart"></canvas></div>
        <div class="grade-dist" id="grade-dist"></div>
      </div>
    </div>

    <!-- Daily Breakdown + Recommendations -->
    <div class="grid-2" style="margin-top:1rem;">
      <div class="card">
        <div class="card-title">Daily Breakdown</div>
        <div style="overflow-x:auto;max-height:300px;overflow-y:auto;">
          <table class="daily-table">
            <thead><tr><th>Date</th><th>Cal In</th><th>Cal Out</th><th>Net</th></tr></thead>
            <tbody id="daily-tbody"></tbody>
          </table>
        </div>
      </div>
      <div class="card">
        <div class="card-title">💡 AI Recommendations</div>
        <div id="recommendations-list">
          ${generateRecs(report, pred).map(r=>`
            <div class="rec-item">
              <span class="rec-icon">${r.icon}</span>
              <div class="rec-text">${r.text}</div>
            </div>
          `).join('')}
        </div>
      </div>
    </div>
  `;

  // Render charts and table
  buildCalChart(report.daily_breakdown);
  buildGradeChart(report.grade_distribution);
  buildDailyTable(report.daily_breakdown);
}

function computeHealthScore(report, pred) {
  let score = 50;
  const grades = report.grade_distribution || {};
  score += (grades.A||0) * 5;
  score += (grades.B||0) * 2;
  score -= (grades.D||0) * 3;
  score -= (grades.F||0) * 5;
  if(pred.fatigue_risk_pct < 50) score += 10;
  if(report.fat_change_kg < 0) score += 10;
  return Math.min(100, Math.max(0, Math.round(score)));
}

function generateRecs(report, pred) {
  const recs = [];
  const net = report.total_calories_consumed - report.total_calories_burned;
  if(net > 1000) recs.push({icon:'🏃',text:'Your caloric surplus is high. Try adding 20 minutes of cardio daily to close the gap.'});
  if(net < -2000) recs.push({icon:'🥗',text:'Large calorie deficit detected. Ensure you\'re eating enough nutrient-dense foods.'});
  if(pred.fatigue_risk_pct > 65) recs.push({icon:'😴',text:'High fatigue risk. Prioritize 7-8 hours of sleep and reduce processed food intake.'});
  if((report.grade_distribution?.D||0) + (report.grade_distribution?.F||0) > 3)
    recs.push({icon:'🥦',text:'Multiple low-grade meals this month. Try swapping fried foods for grilled or baked alternatives.'});
  if(report.total_calories_burned < report.total_calories_consumed * 0.5)
    recs.push({icon:'💪',text:'Activity levels seem low vs intake. Even 30-min walks 3x/week can make a big difference.'});
  recs.push({icon:'💧',text:'Drink at least 2-3 litres of water daily to aid metabolism and reduce false hunger cues.'});
  recs.push({icon:'📱',text:`Keep logging meals daily! Consistency in tracking is the #1 predictor of long-term success.`});
  return recs.slice(0,4);
}

function buildCalChart(daily) {
  if(!daily||!daily.length) return;
  const ctx = document.getElementById('calChart').getContext('2d');
  if(calChart) calChart.destroy();
  calChart = new Chart(ctx, {
    type:'line',
    data:{
      labels: daily.map(d=>d.date.slice(5)),
      datasets:[
        {label:'Consumed',data:daily.map(d=>d.calories_in),borderColor:'#10b981',backgroundColor:'rgba(16,185,129,0.1)',fill:true,tension:0.4,pointRadius:3},
        {label:'Burned',data:daily.map(d=>d.calories_out),borderColor:'#f59e0b',backgroundColor:'rgba(245,158,11,0.05)',fill:true,tension:0.4,pointRadius:3}
      ]
    },
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:'#94a3b8',font:{size:11}}}},scales:{x:{grid:{color:'rgba(255,255,255,0.04)'},ticks:{color:'#64748b',font:{size:9}}},y:{grid:{color:'rgba(255,255,255,0.04)'},ticks:{color:'#64748b',font:{size:9}}}}}
  });
}

function buildGradeChart(grades) {
  if(!grades||!Object.keys(grades).length) return;
  const ctx = document.getElementById('gradeChart').getContext('2d');
  if(gradeChart) gradeChart.destroy();
  const gradeColors = {A:'rgba(16,185,129,0.8)',B:'rgba(99,102,241,0.8)',C:'rgba(245,158,11,0.8)',D:'rgba(249,115,22,0.8)',F:'rgba(244,63,94,0.8)'};
  const labels = Object.keys(grades);
  gradeChart = new Chart(ctx,{
    type:'doughnut',
    data:{labels,datasets:[{data:labels.map(k=>grades[k]),backgroundColor:labels.map(k=>gradeColors[k]||'#64748b'),borderWidth:0}]},
    options:{responsive:true,maintainAspectRatio:false,cutout:'65%',plugins:{legend:{position:'right',labels:{color:'#94a3b8',font:{size:11}}}}}
  });
  const el = document.getElementById('grade-dist');
  if(el) el.innerHTML = labels.map(k=>`<span class="grade-pill gp-${k}">${k}: ${grades[k]}</span>`).join('');
}

function buildDailyTable(daily) {
  const tbody = document.getElementById('daily-tbody');
  if(!tbody||!daily||!daily.length){
    if(tbody) tbody.innerHTML='<tr><td colspan="4" style="color:var(--muted);text-align:center;padding:1rem;">No daily data logged</td></tr>';
    return;
  }
  tbody.innerHTML = [...daily].reverse().map(d=>{
    const net=d.calories_in-d.calories_out;
    return `<tr>
      <td style="color:#94a3b8;">${d.date}</td>
      <td style="color:var(--emerald);font-weight:600;">${Math.round(d.calories_in)}</td>
      <td style="color:var(--amber);font-weight:600;">${Math.round(d.calories_out)}</td>
      <td style="color:${net>0?'var(--coral)':'var(--emerald)'};font-weight:600;">${net>0?'+':''}${Math.round(net)}</td>
    </tr>`;
  }).join('');
}

// Auto-load on page open
loadReport();
</script>
</body>
</html>
