<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle with gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="leafGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#34d399;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="forkGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Main circle background -->
  <circle cx="24" cy="24" r="22" fill="url(#bgGradient)" stroke="#34d399" stroke-width="1" opacity="0.9"/>
  
  <!-- Fork and knife crossed design -->
  <!-- Fork -->
  <path d="M15 12 L15 28 C15 30 16 32 18 32 C20 32 21 30 21 28 L21 12" 
        stroke="url(#forkGradient)" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M15 15 L21 15" stroke="url(#forkGradient)" stroke-width="2" stroke-linecap="round"/>
  <path d="M15 18 L21 18" stroke="url(#forkGradient)" stroke-width="2" stroke-linecap="round"/>
  <path d="M15 21 L21 21" stroke="url(#forkGradient)" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Knife -->
  <path d="M27 12 L27 26 C27 29 28 32 30 32 C32 32 33 29 33 26 L33 18" 
        stroke="#f8fafc" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M33 18 L30 15 L27 18" fill="#f8fafc" stroke="none"/>
  
  <!-- Leaf decoration -->
  <path d="M35 25 Q38 22 35 19 Q32 22 35 25" fill="url(#leafGradient)" opacity="0.8"/>
  <line x1="35" y1="19" x2="35" y2="25" stroke="#059669" stroke-width="1"/>
  
  <!-- Small sparkles -->
  <circle cx="12" cy="36" r="1.5" fill="#fbbf24" opacity="0.8"/>
  <circle cx="36" cy="12" r="1" fill="#34d399" opacity="0.6"/>
  <circle cx="38" cy="36" r="1.2" fill="#fbbf24" opacity="0.7"/>
</svg>
