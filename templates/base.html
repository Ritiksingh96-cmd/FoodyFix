<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodyFix — {% block title %}Intelligence Dashboard{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    {% block head %}{% endblock %}
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Plus Jakarta Sans', 'Inter', 'sans-serif'] },
                    colors: { 
                        emerald: { 50: '#ecfdf5', 100: '#d1fae5', 500: '#10b981', 600: '#059669', 700: '#047857' },
                        slate: { 850: '#1e293b', 900: '#0f172a', 950: '#020617' },
                        indigo: { 50: '#eef2ff', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca' }
                    }
                }
            }
        }
    </script>
    <style>
        [x-cloak] { display: none !important; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #ffffff; color: #0f172a; }
        .topo-bg { 
            background-color: #ffffff;
            background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M11 18c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm48 25c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm-43-7c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm63 31c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM34 90c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm56-76c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM12 86c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zm66-3c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zm-46-45c.552 0 1-.448 1-1s-.448-1-1-1-1 .448-1 1 .448 1 1 1zm26 18c.552 0 1-.448 1-1s-.448-1-1-1-1 .448-1 1 .448 1 1 1zm16 18c.552 0 1-.448 1-1s-.448-1-1-1-1 .448-1 1 .448 1 1 1zm-44 26c.552 0 1-.448 1-1s-.448-1-1-1-1 .448-1 1 .448 1 1 1zm16-40c.552 0 1-.448 1-1s-.448-1-1-1-1 .448-1 1 .448 1 1 1zm0 20c.552 0 1-.448 1-1s-.448-1-1-1-1 .448-1 1 .448 1 1 1zm-8-10c.552 0 1-.448 1-1s-.448-1-1-1-1 .448-1 1 .448 1 1 1zm32-10c.552 0 1-.448 1-1s-.448-1-1-1-1 .448-1 1 .448 1 1 1zm-16-10c.552 0 1-.448 1-1s-.448-1-1-1-1 .448-1 1 .448 1 1 1zm32-10c.552 0 1-.448 1-1s-.448-1-1-1-1 .448-1 1 .448 1 1 1z' fill='%2310b981' fill-opacity='0.03' fill-rule='evenodd'/%3E%3C/svg%3E");
        }
        .sidebar-gradient { background: linear-gradient(180deg, #0f172a 0%, #1e293b 100%); }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.05); }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(16, 185, 129, 0.2); border-radius: 10px; }
        .nav-item { transition: all 0.2s ease; color: rgba(255,255,255,0.6); position: relative; }
        .nav-item.active { background: rgba(16, 185, 129, 0.1); color: #10b981; }
        .nav-item.active::after { content: ''; position: absolute; right: 0; top: 20%; height: 60%; width: 4px; background: #10b981; border-radius: 4px 0 0 4px; }
        .nav-item:hover:not(.active) { color: white; background: rgba(255,255,255,0.05); }
        .bento-item { background: white; border-radius: 2rem; border: 1px solid #f1f5f9; box-shadow: 0 4px 20px -5px rgba(0, 0, 0, 0.05); transition: all 0.3s ease; }
        {% block styles %}{% endblock %}
    </style>
</head>
<body class="flex min-h-screen topo-bg">

<!-- Universal Sidebar -->
<aside class="w-72 sidebar-gradient flex flex-col fixed inset-y-0 left-0 z-50 text-white shadow-2xl overflow-y-auto custom-scrollbar">
    <div class="p-8 flex-shrink-0">
        <a href="/dashboard" class="flex items-center gap-3 mb-12">
            <img src="/static/images/logo_ai.png" class="w-11 h-11 shadow-lg shadow-emerald-500/30 rounded-2xl" alt="FoodyFix">
            <span class="text-2xl font-black tracking-tighter text-white">Foody<span class="text-emerald-400">Fix</span></span>
        </a>

        <nav class="space-y-1" id="main-nav">
            <div class="text-[10px] font-black text-slate-500 uppercase tracking-[0.3em] mb-4 px-4">Core Workspace</div>
            <a href="/dashboard" data-path="/dashboard" class="nav-item w-full flex items-center gap-4 px-6 py-3.5 rounded-2xl text-sm font-bold transition-all group">
                <i data-lucide="layout-dashboard" class="w-5 h-5 opacity-70 group-hover:opacity-100 transition-opacity"></i>
                Overview
            </a>
            <a href="/scan" data-path="/scan" class="nav-item w-full flex items-center gap-4 px-6 py-3.5 rounded-2xl text-sm font-bold transition-all group">
                <i data-lucide="camera" class="w-5 h-5 opacity-70 group-hover:opacity-100 transition-opacity"></i>
                AI Scanner
            </a>
            <a href="/orders" data-path="/orders" class="nav-item w-full flex items-center gap-4 px-6 py-3.5 rounded-2xl text-sm font-bold transition-all group">
                <i data-lucide="package" class="w-5 h-5 opacity-70 group-hover:opacity-100 transition-opacity"></i>
                Deliveries
            </a>
            <a href="/reports" data-path="/reports" class="nav-item w-full flex items-center gap-4 px-6 py-3.5 rounded-2xl text-sm font-bold transition-all group">
                <i data-lucide="bar-chart-3" class="w-5 h-5 opacity-70 group-hover:opacity-100 transition-opacity"></i>
                Analytics
            </a>
            <a href="/diet" data-path="/diet" class="nav-item w-full flex items-center gap-4 px-6 py-3.5 rounded-2xl text-sm font-bold transition-all group">
                <i data-lucide="utensils" class="w-5 h-5 opacity-70 group-hover:opacity-100 transition-opacity"></i>
                Diet Plan
            </a>
            <a href="/rewards" data-path="/rewards" class="nav-item w-full flex items-center gap-4 px-6 py-3.5 rounded-2xl text-sm font-bold transition-all group">
                <i data-lucide="award" class="w-5 h-5 opacity-70 group-hover:opacity-100 transition-opacity"></i>
                Rewards
            </a>
        </nav>
    </div>

    <div class="mt-auto p-6 space-y-4">
        <div class="bg-white/5 border border-white/10 rounded-[2rem] p-5 cursor-pointer hover:bg-white/10 transition-all border-emerald-500/50" onclick="window.location.href='/profile'">
            <div class="flex items-center gap-4 mb-4">
                <div class="w-10 h-10 rounded-xl bg-emerald-500 flex items-center justify-center font-black text-white text-lg overflow-hidden">
                    <img id="sb-user-avatar" src="" class="w-full h-full object-cover hidden" alt="Profile">
                    <i id="sb-user-icon" data-lucide="user" class="w-5 h-5"></i>
                </div>
                <div class="min-w-0">
                    <div class="text-[11px] font-black truncate text-white" id="sb-user-name">Health Architect</div>
                    <div class="text-[9px] font-black text-emerald-400 uppercase tracking-widest">Master Level</div>
                </div>
            </div>
            <div class="flex justify-between text-[9px] font-black text-slate-500 uppercase mb-2">
                <span>FoodyCredits</span>
                <span id="sb-credits-val" class="text-emerald-400">0</span>
            </div>
            <div class="w-full bg-white/10 rounded-full h-1.5 overflow-hidden">
                <div id="sb-credits-bar" class="bg-emerald-500 h-1.5 rounded-full transition-all duration-1000" style="width: 0%"></div>
            </div>
        </div>
        
        <button onclick="window.location.href='/auth'" class="w-full flex items-center gap-4 px-6 py-3.5 rounded-2xl text-xs font-black uppercase tracking-widest text-slate-400 hover:text-rose-400 hover:bg-rose-500/10 transition-all group">
            <i data-lucide="log-out" class="w-4 h-4 opacity-70 group-hover:opacity-100 transition-opacity"></i>
            Terminate Session
        </button>
    </div>
</aside>

<!-- Main Interface -->
<main class="flex-1 ml-72 h-screen overflow-y-auto scroll-smooth">
    <div class="w-full px-12 py-12">
        {% block content %}{% endblock %}
    </div>
</main>

<script>
    // Unified Data Synchronization
    async function syncPortalData() {
        try {
            const [profileRes, creditsRes] = await Promise.all([
                fetch('/api/profile'),
                fetch('/api/credits')
            ]);
            const profileData = await profileRes.json();
            const creditsData = await creditsRes.json();
            
            const profile = profileData.profile;
            
            // Update Sidebar
            const sbName = document.getElementById('sb-user-name');
            if(sbName) sbName.textContent = profile.name;
            
            const avatar = document.getElementById('sb-user-avatar');
            const icon = document.getElementById('sb-user-icon');
            if (profile.photo_url && avatar && icon) {
                avatar.src = profile.photo_url;
                avatar.classList.remove('hidden');
                icon.classList.add('hidden');
            }
            
            const credVal = document.getElementById('sb-credits-val');
            const credBar = document.getElementById('sb-credits-bar');
            if(credVal) credVal.textContent = creditsData.credits;
            if(credBar) credBar.style.width = creditsData.progress_pct + '%';
            
            // Re-initialize icons in case any dynamic content was added
            lucide.createIcons();
            
            // Allow child templates to handle synced data
            if(window.onPortalSync) window.onPortalSync({profile, credits: creditsData});
            
        } catch (e) {
            console.error("Portal sync error:", e);
        }
    }

    // Set Active Nav Item
    function setActiveNav() {
        const path = window.location.pathname;
        const navItems = document.querySelectorAll('.nav-item');
        navItems.forEach(item => {
            const itemPath = item.getAttribute('href');
            if(itemPath === path || (path === '/' && itemPath === '/dashboard')) {
                item.classList.add('active');
            } else {
                item.classList.remove('active');
            }
        });
    }

    document.addEventListener('DOMContentLoaded', () => {
        setActiveNav();
        syncPortalData();
        lucide.createIcons();
    });
</script>
{% block scripts %}{% endblock %}
</body>
</html>
