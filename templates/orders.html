<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FoodyFix — Order Intelligence</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: { sans: ['Plus Jakarta Sans', 'Inter', 'sans-serif'] },
        colors: { emerald: { 50: '#ecfdf5', 500: '#10b981', 600: '#059669', 700: '#047857' } }
      }
    }
  }
</script>
<style>
  body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #ffffff; color: #0f172a; }
  .topo-bg { 
    background-color: #ffffff;
    background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M11 18c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm48 25c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm-43-7c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm63 31c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM34 90c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm56-76c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM12 86c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zm66-3c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zm-46-45c.552 0 1-.448 1-1s-.448-1-1-1-1 .448-1 1 .448 1 1 1zm26 18c.552 0 1-.448 1-1s-.448-1-1-1-1 .448-1 1 .448 1 1 1zm16 18c.552 0 1-.448 1-1s-.448-1-1-1-1 .448-1 1 .448 1 1 1zm-44 26c.552 0 1-.448 1-1s-.448-1-1-1-1 .448-1 1 .448 1 1 1zm16-40c.552 0 1-.448 1-1s-.448-1-1-1-1 .448-1 1 .448 1 1 1zm0 20c.552 0 1-.448 1-1s-.448-1-1-1-1 .448-1 1 .448 1 1 1zm-8-10c.552 0 1-.448 1-1s-.448-1-1-1-1 .448-1 1 .448 1 1 1zm32-10c.552 0 1-.448 1-1s-.448-1-1-1-1 .448-1 1 .448 1 1 1zm-16-10c.552 0 1-.448 1-1s-.448-1-1-1-1 .448-1 1 .448 1 1 1zm32-10c.552 0 1-.448 1-1s-.448-1-1-1-1 .448-1 1 .448 1 1 1z' fill='%2310b981' fill-opacity='0.03' fill-rule='evenodd'/%3E%3C/svg%3E");
  }
  .bento-item { background: white; border-radius: 2.5rem; border: 1px solid #f1f5f9; box-shadow: 0 4px 20px -5px rgba(0, 0, 0, 0.05); overflow: hidden; }
  .table-row:hover { background: #f8fafc; }
  .loader { width:18px;height:18px;border:2.5px solid rgba(0,0,0,0.1);border-top-color:#10b981;border-radius:50%;animation:spin 0.8s linear infinite;display:inline-block; }
  @keyframes spin { to{transform:rotate(360deg)} }
</style>
</head>
<body class="min-h-screen topo-bg">

<!-- Navigation -->
<nav class="sticky top-0 z-50 bg-white/80 backdrop-blur-2xl border-b border-slate-100">
  <div class="max-w-6xl mx-auto px-8 py-6 flex items-center justify-between">
    <a href="/dashboard" class="flex items-center gap-4">
      <div class="w-11 h-11 bg-emerald-500 rounded-2xl flex items-center justify-center font-black text-white text-xl shadow-lg">F</div>
      <span class="text-2xl font-black tracking-tighter text-slate-900">Foody<span class="text-emerald-500">Fix</span></span>
    </a>
    <div class="flex items-center gap-8">
        <a href="/dashboard" class="text-sm font-black text-slate-500 hover:text-emerald-600 transition-colors uppercase tracking-widest">Dashboard</a>
        <a href="/reports" class="text-sm font-black text-slate-500 hover:text-emerald-600 transition-colors uppercase tracking-widest">Analytics</a>
        <a href="/dashboard" class="px-8 py-3 bg-slate-900 text-white rounded-2xl font-black text-xs uppercase tracking-widest hover:bg-slate-800 transition-all shadow-xl shadow-slate-900/10">Back Home</a>
    </div>
  </div>
</nav>

<main class="max-w-6xl mx-auto px-8 py-20">
  <div class="grid lg:grid-cols-12 gap-12">
    
    <!-- Integration Manager -->
    <div class="lg:col-span-4 space-y-12">
        <div class="bento-item p-12 shadow-xl shadow-slate-100/50">
            <h2 class="text-2xl font-black text-slate-900 mb-8 tracking-tighter">Identity Sync</h2>
            <div class="space-y-6">
                <div class="p-6 rounded-3xl bg-slate-50 border border-slate-100 flex items-center justify-between group cursor-pointer hover:border-emerald-200 transition-all">
                    <div class="flex items-center gap-4">
                        <img src="https://www.svgrepo.com/show/303248/uber-eats-logo.svg" class="w-8 h-8" alt="UberEats">
                        <span class="text-sm font-black text-slate-700">UberEats</span>
                    </div>
                    <span class="text-[10px] font-black text-emerald-600 uppercase tracking-widest">Connected</span>
                </div>
                <div class="p-6 rounded-3xl bg-slate-50 border border-slate-100 flex items-center justify-between group cursor-pointer hover:border-emerald-200 transition-all">
                    <div class="flex items-center gap-4">
                        <img src="https://www.svgrepo.com/show/303274/doordash-logo.svg" class="w-8 h-8" alt="DoorDash">
                        <span class="text-sm font-black text-slate-700">DoorDash</span>
                    </div>
                    <button class="text-[10px] font-black text-slate-400 uppercase tracking-widest hover:text-slate-900">Configure</button>
                </div>
            </div>
            <button class="w-full mt-12 py-5 bg-slate-900 text-white rounded-2xl font-black text-xs uppercase tracking-[0.2em] shadow-xl shadow-slate-900/10 hover:bg-slate-800 transition-all">
                Connect New Provider
            </button>
        </div>

        <div class="bento-item p-12 bg-emerald-50 border-emerald-100 shadow-xl shadow-emerald-500/5">
            <h3 class="text-[10px] font-black text-emerald-600 uppercase tracking-widest mb-6">Automation Protocol</h3>
            <p class="text-xl font-black text-emerald-950 leading-tight tracking-tighter">Your delivery data is automatically archived using our proprietary Webhook Sync.</p>
        </div>
    </div>

    <!-- Order Ledger -->
    <div class="lg:col-span-8 bento-item p-12 shadow-xl shadow-slate-100/50">
        <div class="flex justify-between items-center mb-12">
            <h2 class="text-3xl font-black text-slate-900 tracking-tighter">Order Archive</h2>
            <div class="flex gap-4">
                <button class="px-6 py-2.5 rounded-xl border border-slate-100 text-[10px] font-black text-slate-400 uppercase tracking-widest hover:bg-slate-50">Filter</button>
                <button class="px-6 py-2.5 rounded-xl border border-slate-100 text-[10px] font-black text-slate-400 uppercase tracking-widest hover:bg-slate-50">Export JSON</button>
            </div>
        </div>

        <div class="overflow-x-auto">
            <table class="w-full text-left">
                <thead>
                    <tr class="border-b border-slate-100">
                        <th class="pb-6 text-[10px] font-black text-slate-400 uppercase tracking-widest">Order ID</th>
                        <th class="pb-6 text-[10px] font-black text-slate-400 uppercase tracking-widest">Entity</th>
                        <th class="pb-6 text-[10px] font-black text-slate-400 uppercase tracking-widest">Metabolic Outcome</th>
                        <th class="pb-6 text-right text-[10px] font-black text-slate-400 uppercase tracking-widest">Archived At</th>
                    </tr>
                </thead>
                <tbody id="orders-list">
                    <!-- Orders here -->
                </tbody>
            </table>
        </div>
        
        <div id="no-orders" class="hidden text-center py-24 text-slate-400 font-black uppercase tracking-[0.2em] text-[10px] border-4 border-dashed border-slate-50 rounded-[3rem] mt-12">
            No external order data synchronised.
        </div>
    </div>
  </div>
</main>

<script>
async function load() {
    const res = await fetch('/api/orders');
    const data = await res.json();
    const list = document.getElementById('orders-list');
    
    if(data.orders.length === 0) {
        document.getElementById('no-orders').classList.remove('hidden');
        return;
    }

    list.innerHTML = data.orders.map(o => `
        <tr class="table-row border-b border-slate-50 transition-colors">
            <td class="py-8">
                <div class="text-sm font-black text-slate-900 mb-1">#${o.id.slice(0,8)}</div>
                <div class="text-[10px] font-black text-slate-400 uppercase tracking-widest">${o.source}</div>
            </td>
            <td class="py-8">
                <div class="text-sm font-bold text-slate-700">${o.restaurant}</div>
                <div class="text-xs text-slate-400 font-medium">${o.items.length} Component(s)</div>
            </td>
            <td class="py-8">
                <div class="flex items-center gap-3">
                    <span class="w-8 h-8 rounded-lg bg-emerald-50 text-emerald-600 flex items-center justify-center font-black text-xs border border-emerald-100">A</span>
                    <div class="text-sm font-black text-slate-900 tracking-tighter">${o.total_calories} kcal</div>
                </div>
            </td>
            <td class="py-8 text-right">
                <div class="text-xs font-black text-slate-900 mb-1">${o.timestamp.split('T')[0]}</div>
                <div class="text-[10px] font-black text-slate-500 uppercase tracking-widest">Verified</div>
            </td>
        </tr>
    `).join('');
}
load();
</script>
</body>
</html>
