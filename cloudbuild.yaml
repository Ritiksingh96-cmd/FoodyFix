# Google Cloud Build configuration for automated deployment

steps:
  # Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/foodyfix:$COMMIT_SHA', '.']
  
  # Push the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/foodyfix:$COMMIT_SHA']
  
  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
    - 'run'
    - 'deploy'
    - 'gcr.io/$PROJECT_ID/foodyfix:$COMMIT_SHA'
    - '--region=us-central1'
    - '--platform=managed'
    - '--allow-unauthenticated'
    - '--port=8080'
    - '--memory=1Gi'
    - '--cpu=1'
    - '--min-instances=1'
    - '--max-instances=10'
    - '--set-env-vars'
    - 'GEMINI_API_KEY=$_GEMINI_API_KEY'
    - 'FIREBASE_PROJECT_ID=$_FIREBASE_PROJECT_ID'
    - 'FIREBASE_PRIVATE_KEY_ID=$_FIREBASE_PRIVATE_KEY_ID'
    - 'FIREBASE_PRIVATE_KEY=$_FIREBASE_PRIVATE_KEY'
    - 'FIREBASE_CLIENT_EMAIL=$_FIREBASE_CLIENT_EMAIL'
    - 'FIREBASE_CLIENT_ID=$_FIREBASE_CLIENT_ID'
    - 'ENVIRONMENT=production'
    - 'GCP_PROJECT_ID=$PROJECT_ID'
    - 'GCP_LOGGING_ENABLED=true'

# Configure the image
images:
  - 'gcr.io/$PROJECT_ID/foodyfix:$COMMIT_SHA'

# Build options
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'
  diskSizeGb: 100
